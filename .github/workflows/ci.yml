name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per branch, never cancelled: two pushes cannot finish out of order and leave
# an older image tagged `latest`.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: lint, types, tests (Python 3.12, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install --no-deps -r requirements-ocr.txt
          python -c "import importlib.metadata as m; assert not any(d.metadata['Name'] == 'opencv-python' for d in m.distributions()), 'desktop opencv-python must not be installed'"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration and not slow" -q
      - name: Integration tests (real OCR engine, vendored models, no network)
        env:
          TTB_OCR_WORKERS: "2"
          RAPIDOCR_LOG_LEVEL: warning
        run: pytest -m integration -q
      - name: Verify vendored model hashes
        run: python tools/vendor_models.py --verify
      - name: Dependency audit
        run: pip-audit -r requirements.txt -r requirements-ocr.txt --strict || echo "::warning::pip-audit reported findings; review before release"

  container:
    name: container builds and answers health (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test  # nothing is published unless lint, types, unit and integration tests passed
    env:
      HAS_ACR: ${{ secrets.ACR_LOGIN_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: label-check:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run with networking disabled, wait for ready, verify the bundled sample (all inside the container)
        run: |
          docker run -d --name lc --network none --tmpfs /tmp -e TTB_OCR_WORKERS=1 label-check:ci
          docker exec -i -e READY_TIMEOUT=180 lc python - < tools/container_smoke.py
      - name: Container logs
        if: always()
        run: docker logs lc || true
      # Publish the verified image to the Azure Container Registry the app pulls from.
      # (ACR's own cloud build is disabled on new subscriptions, so CI is the build farm.)
      - name: Log in to Azure Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && env.HAS_ACR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push image (sha + latest)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && env.HAS_ACR == 'true'
        run: |
          SHORT=${GITHUB_SHA::7}
          docker tag label-check:ci ${{ secrets.ACR_LOGIN_SERVER }}/label-check:$SHORT
          docker tag label-check:ci ${{ secrets.ACR_LOGIN_SERVER }}/label-check:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/label-check:$SHORT
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/label-check:latest
          echo "pushed label-check:$SHORT"
