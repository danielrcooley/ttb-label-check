name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests (Python 3.12, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration and not slow" -q
      - name: Integration tests (real OCR engine, vendored models, no network)
        env:
          TTB_OCR_WORKERS: "2"
          RAPIDOCR_LOG_LEVEL: warning
        run: pytest -m integration -q
      - name: Verify vendored model hashes
        run: python tools/vendor_models.py --verify
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict || echo "::warning::pip-audit reported findings; review before release"

  container:
    name: container builds and answers health (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: label-check:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run with networking disabled and wait for ready
        run: |
          docker run -d --name lc --network none --tmpfs /tmp -e TTB_OCR_WORKERS=1 label-check:ci
          for i in $(seq 1 60); do
            if docker exec lc python -c "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); sys.exit(0 if json.load(r).get('ready') else 1)"; then
              echo "ready after ${i}s"; break
            fi
            sleep 1
          done
          docker exec lc python -c "import json,urllib.request; print(json.dumps(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')), indent=1))"
      - name: Verify the bundled sample inside the container (no network)
        run: |
          docker exec lc python - <<'PY'
          import json, urllib.request, uuid
          boundary = uuid.uuid4().hex
          app = {"beverage_type":"spirits","brand_name":"OLD TOM DISTILLERY","class_type":"Kentucky Straight Bourbon Whiskey","alcohol_content":"45% Alc./Vol. (90 Proof)","net_contents":"750 mL"}
          parts = [("application", None, json.dumps(app).encode())]
          for n in ("clean_front.png", "clean_back.png"):
              parts.append(("images", n, open(f"/app/app/static/samples/{n}", "rb").read()))
          body = b""
          for name, fn, data in parts:
              body += f"--{boundary}\r\n".encode()
              if fn:
                  body += f'Content-Disposition: form-data; name="{name}"; filename="{fn}"\r\nContent-Type: image/png\r\n\r\n'.encode()
              else:
                  body += f'Content-Disposition: form-data; name="{name}"\r\n\r\n'.encode()
              body += data + b"\r\n"
          body += f"--{boundary}--\r\n".encode()
          req = urllib.request.Request("http://127.0.0.1:8000/api/v1/verify", data=body, headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
          res = json.load(urllib.request.urlopen(req, timeout=120))
          print(res["verdict"], res["summary"], res["timing"])
          assert res["verdict"] == "ready_for_approval", res["summary"]
          PY
      - name: Container logs
        if: always()
        run: docker logs lc || true
